# A standalone, per-run, on-demand web terminal into ONE benchmark VM's SSH port. Not part of any agent's project;
# started only when the user clicks "Open terminal" for that run, stopped when they close it. Its own destination
# (host:VM_SSH_PORT) is fixed in its command line, so whoever is typing in the browser can run commands inside the
# VM, but can never redirect this container anywhere else - same safety argument as the other narrow relays.
# Loopback-only published port; HTTP basic-auth token is generated fresh per session and never logged.
name: ${TERM_PROJECT}

services:
  terminal:
    # The official ttyd images ship no ssh client (checked: latest, alpine, 1.7.7, 1.7.7-alpine), so ttyd's
    # "ssh ..." failed with "execvp failed" on every connect. Built locally once, on first use, then reused.
    image: aiagentplayground-vmterm:ttyd-1.7.7
    build:
      dockerfile_inline: |
        FROM tsl0922/ttyd:1.7.7-alpine
        RUN apk add --no-cache openssh-client
    restart: "no"
    # ssh refuses a private key others can read, and Docker Desktop on Windows mounts every host file as 0777: copy
    # the key into this container's private tmpfs as 0600 first, then exec ttyd with its argv unchanged ("$$@").
    command: ["sh", "-c", "install -m 600 /keys/id_ed25519 /tmp/id_ed25519 && exec \"$$@\"", "sh",
              "ttyd", "-p", "7681", "-W", "-c", "${TERM_CRED}",
              "ssh", "-i", "/tmp/id_ed25519", "-p", "${VM_SSH_PORT}",
              "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=/dev/null", "-o", "LogLevel=ERROR",
              "bench@vm-host"]
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:size=1m,mode=0700
    extra_hosts:
      - "vm-host:host-gateway"
    volumes:
      - ${KEY_PATH}:/keys/id_ed25519:ro
    ports:
      - "127.0.0.1:${TERM_PORT}:7681"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32
